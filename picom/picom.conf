backend = "glx";
xrender-sync-fence = true;

vsync = true;

corner-radius = 8;
rounded-corners-exclude = [
    "class_g = 'i3bar'",
    "window_type = 'popup_menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'menu'",
    "window_type = 'utility'",
]

shadow = true;
shadow-radius = 4;
shadow-opacity = 0.3;
shadow-offset-x = 5;
shadow-offset-y = 5;
shadow-exclude = [
    "class_g = 'Google-chrome'",
    "class_g = 'Chromium'",
    "window_type = 'popup_menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'menu'",
    "window_type = 'utility'",
]

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

frame-opacity = 1;
active-opacity = 1;
inactive-opacity = 0.5;

blur-method = "dual_kawase";
blur-strength = 5;
blur-size = 12;
blur-exclude = [
    "class_g = 'Google-chrome'",
    "class_g = 'Chromium'",
    "window_type = 'popup_menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'menu'",
    "window_type = 'utility'",
]

# vim: ft=cfg
