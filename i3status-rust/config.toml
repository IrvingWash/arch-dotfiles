[icons]
icons = "material-nf"

[theme]
theme = "plain"

[[block]]
block = "cpu"
interval = 5
info_cpu = 20
warning_cpu = 50
critical_cpu = 90

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
alert_unit = "GB"
interval = 20
warning = 20.0
alert = 10.0
format = " $icon $available.eng(w:2) "

[[block]]
block = "memory"
interval = 5
format = " $icon $mem_total_used_percents.eng(w:2) "

[[block]]
block = "nvidia_gpu"
interval = 5

[[block]]
block = "sound"
[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
interval = 5
block = "battery"

[[block]]
block = "keyboard_layout"
[block.mappings]
"English (Colemak-DH-Ortho)" = "CDH"

[[block]]
block = "temperature"

[[block]]
block = "time"
interval = 5
format = " $timestamp.datetime(f:'%a %d/%m %R') "
